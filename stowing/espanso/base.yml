matches:  
############
  - trigger: ",--"
    replace: "—"
############
  - trigger: ",<"
    replace: "«$|$»"
############
  - trigger: ",box"
    replace: "- [ ]"
############
  - trigger: ",dong"
    replace: "🎐🌸💬 ¡¡DOOONGGGG!! 💬🌸🎐"
############
  - trigger: ",dot"
    replace: "⋅"
############
  - trigger: ",home"
    replace: "cd ~/is-ma/home"
############
  - trigger: ",iplocal"
    replace: "{{ip}}"
    vars:
      - name: ip
        type: shell
        params:
          cmd: "hostname -I | awk '{print $1}'"
############
  - trigger: ",ipweb"
    replace: "{{ip}}"
    vars:
      - name: ip
        type: shell
        params:
          cmd: "hostname -I | awk '{print $2}'"
############
  - trigger: ",isma"
    replace: "cd ~/is-ma/"
############
  - trigger: ",line"
    replace: "########## ########## ##########"
############
  - trigger: ",vio"
    replace: "violinantiguo@gmail.com"
############
  - trigger: ",vv"
    replace: "✓"
############
  - trigger: ",xx"
    replace: "✗"
