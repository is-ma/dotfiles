[general]
live_config_reload = true

[window]
padding = { x = 5, y = 5 }
decorations = "None"
decorations_theme_variant = "Dark"

[scrolling]
history = 50000
multiplier = 1

[font]
size = 11.0

[font.normal]
family = "MesloLGMDZ Nerd Font Mono"
style = "Regular"

[font.bold]
family = "MesloLGMDZ Nerd Font Mono"
style = "Bold"

[font.italic]
family = "MesloLGMDZ Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "MesloLGMDZ Nerd Font Mono"
style = "Bold Italic"


# ===========================================
# TEMA: Gruvbox Dark
# Fuente: https://github.com/morhetz/gruvbox
# ===========================================
[colors]
primary = { background = "#282828", foreground = "#ebdbb2" }
#vi_mode_cursor = { text = "#cc241d", cursor = "#689d6a" }

#[colors.selection]
#text = "#ffffff"
#background = "#444444"

[colors.selection]
text = "#ebdbb2"        # Mismo color (sin cambio)
background = "#3c3836"  # Gruvbox gray

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 650
blink_timeout = 5
unfocused_hollow = true

